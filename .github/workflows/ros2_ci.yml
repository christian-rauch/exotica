# ROS2 CI for EXOTica using ros-tooling/action-ros-ci
# See https://github.com/ros-tooling/action-ros-ci for documentation.

name: ROS2-CI

on: [push, pull_request]

jobs:
  format-check:
    name: Format check (clang-format-22)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt install -y clang-format-22
      - name: Check C++ formatting
        run: |
          find . \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            ! -path './build/*' ! -path './install/*' ! -path './log/*' \
            | xargs clang-format-22 --style=file --dry-run --Werror

  build-test:
    name: "${{ matrix.distribution }} (${{ matrix.ros }})"

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - {distribution: ubuntu,    version: 22.04, ros: humble}
          - {distribution: ubuntu,    version: 24.04, ros: jazzy}
          - {distribution: ubuntu,    version: 26.04, ros: lyrical}

    container:
      image: ${{ matrix.distribution }}:${{ matrix.version }}

    env:
      CCACHE_DIR: /github/home/.ccache
      PIP_BREAK_SYSTEM_PACKAGES: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.ros }}-Release-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ros }}-Release-
      - uses: ros-tooling/setup-ros@v0.7
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: |
            exotica
            exotica_core
            exotica_python
            exotica_examples
            exotica_core_task_maps
            exotica_collision_scene_fcl_latest
            exotica_aico_solver
            exotica_ik_solver
            exotica_ompl_solver
            exotica_ompl_control_solver
            exotica_ddp_solver
            exotica_ilqg_solver
            exotica_ilqr_solver
            exotica_levenberg_marquardt_solver
            exotica_scipy_solver
            exotica_time_indexed_rrt_connect_solver
            exotica_cartpole_dynamics_solver
            exotica_pendulum_dynamics_solver
            exotica_double_integrator_dynamics_solver
            exotica_quadrotor_dynamics_solver
            exotica_pinocchio_dynamics_solver
          target-ros2-distro: ${{ matrix.ros }}
          extra-cmake-args: -DCMAKE_BUILD_TYPE=Release
          no-symlink-install: true
          colcon-mixin-repository: https://raw.githubusercontent.com/colcon/colcon-mixin-repository/master/index.yaml
          skip-tests: true
